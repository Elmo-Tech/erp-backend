name: P0-01 Temporary Lockfile Bootstrap
on:
  push:
    branches: [task/p0-01-ci-baseline]
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/task/p0-01-ci-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/p0-01-ci-baseline
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, redis, pcntl, bcmath, intl
          coverage: none
      - name: Generate authentic Composer 2 lockfile
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Verify Composer lockfile and commit to task branch only
        run: |
          set -euo pipefail
          composer validate --strict
          test -s composer.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(p0-01): pin Composer dependency resolution"
          git push origin HEAD:refs/heads/task/p0-01-ci-baseline
