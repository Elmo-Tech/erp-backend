name: Backend CI
on:
  push:
    branches: [rebuild/erp-v2]
  pull_request:
    branches: [rebuild/erp-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: elmo_erp_test
      DB_USERNAME: elmo
      DB_PASSWORD: test-only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elmo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: elmo_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elmo -d elmo_erp_test" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Require an authentic Composer lockfile
        run: |
          test -s composer.lock || { echo '::error::composer.lock missing; generate using Composer 2 with registry access and commit it'; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, redis, pcntl, bcmath, intl
          coverage: none
      - name: Validate and install locked PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated test application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify PostgreSQL 18 migrations
        run: php artisan migrate:fresh --force --no-interaction
      - name: Run PHPUnit against disposable PostgreSQL 18
        run: php artisan test --no-ansi
      - name: Verify P0-03 migration rollback and re-apply on disposable PostgreSQL
        run: |
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction
      - name: Verify disposable PostgreSQL RLS role and transaction-local context
        run: PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -f database/security/p003_rls_pilot.sql
      - name: Verify two PostgreSQL sessions, company context and exclusion races
        run: php tests/integration/p003_concurrency.php
      - name: Start real PgBouncer in transaction pooling mode (disposable only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pgbouncer
          sudo systemctl stop pgbouncer || true
          cat > /tmp/p003b-pgbouncer.ini <<'EOF'
          [databases]
          elmo_erp_test = host=127.0.0.1 port=5432 dbname=elmo_erp_test
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 16432
          auth_type = trust
          auth_file = /tmp/p003b-auth.txt
          admin_users = elmo
          pool_mode = transaction
          default_pool_size = 2
          max_client_conn = 100
          server_reset_query = DISCARD ALL
          max_prepared_statements = 100
          EOF
          printf '"elmo" "test-only"\n"p003c_runtime" "test-only-runtime"\n"p003e_web" "ci-only-web"\n"p003e_mfa" "ci-only-mfa"\n"p003e_queue" "ci-only-queue"\n"p003e_session" "ci-only-session"\n' > /tmp/p003b-auth.txt
          pgbouncer /tmp/p003b-pgbouncer.ini > /tmp/p003b-pgbouncer.log 2>&1 &
          sleep 2
          cat /tmp/p003b-pgbouncer.log
          PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p 16432 -U elmo pgbouncer -Atc 'SHOW CONFIG' | grep -E '^pool_mode[|]transaction[|]'
      - name: Run authenticated-context tests through actual PgBouncer
        env:
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
        run: php artisan test --no-ansi tests/P003B/P003AuthenticatedContextTest.php
      - name: Verify two parallel clients through real transaction pool
        env:
          DB_PORT: '16432'
        run: php tests/integration/p003_pool_clients.php
      - name: Run five jobs inside one reused Laravel queue worker through PgBouncer
        env:
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          QUEUE_CONNECTION: database
          P003_EVIDENCE_FILE: /tmp/p003b-queue-evidence.jsonl
        run: |
          rm -f /tmp/p003b-queue-evidence.jsonl
          php tests/integration/p003_queue_seed.php
          php artisan queue:work database --queue=p003b --stop-when-empty --tries=1 --sleep=1 --timeout=30 --max-time=120
          php tests/integration/p003_queue_assert.php
      - name: Seed synthetic EG / IT users using migration-owner credentials
        run: php tests/integration/p003c_seed.php
      - name: Provision restricted PostgreSQL runtime role (CI database only)
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 -v runtime_password='test-only-runtime' -h "$DB_HOST" -p 5432 -U elmo -d "$DB_DATABASE" -f database/security/p003c_runtime_role.sql
      - name: Prove runtime role cannot DDL, impersonate owner, rewrite grants or read raw finance (direct)
        run: |
          PGPASSWORD='test-only-runtime' psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U p003c_runtime -d "$DB_DATABASE" -f database/security/p003c_runtime_boundary.sql
      - name: Prove disposable RLS scope and reproduce the writable-GUC bypass (NOT production RLS)
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U elmo -d "$DB_DATABASE" -f database/security/p003c_runtime_rls_disposable.sql
      - name: Prove runtime role boundary via actual PgBouncer transaction pooling
        run: |
          PGPASSWORD='test-only-runtime' psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 16432 -U p003c_runtime -d "$DB_DATABASE" -f database/security/p003c_runtime_boundary.sql
      - name: Run parallel authenticated HTTP sessions against runtime-only PgBouncer connection
        env:
          DB_USERNAME: p003c_runtime
          DB_PASSWORD: test-only-runtime
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          SESSION_DRIVER: database
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          php -S 127.0.0.1:18031 -t public public/index.php > /tmp/p003c-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/p003c-http.log' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18031/api/v1/health | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          python3 tests/integration/p003c_http_parallel.py
      - name: Prove concurrent revocation waits for live transaction and subsequent tenant access is denied
        env:
          DB_USERNAME: p003c_runtime
          DB_PASSWORD: test-only-runtime
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          P003C_OWNER_PASSWORD: test-only
        run: php tests/integration/p003c_runtime_race.php
      - name: Audit runtime GRANT gaps and expected Auth/MFA denial on direct PostgreSQL and PgBouncer
        run: |
          for port in 5432 16432; do
            PGPASSWORD='test-only-runtime' psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p "$port" -U p003c_runtime -d "$DB_DATABASE" -f database/security/p003d_runtime_grant_audit.sql
          done
      - name: Test rollback-only signed DB tenant claim against SQL spoofing (PostgreSQL 18)
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p 5432 -U elmo -d "$DB_DATABASE" -f database/security/p003d_signed_claim_disposable.sql
      - name: Provision P0-03E split-principal permission probe (disposable CI only)
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 \
            -v web_password='ci-only-web' -v mfa_password='ci-only-mfa' \
            -v queue_password='ci-only-queue' -v session_password='ci-only-session' \
            -h 127.0.0.1 -p 5432 -U elmo -d "$DB_DATABASE" \
            -f database/security/p003e_role_partition_disposable.sql
      - name: Verify P0-03E split role grants on direct PostgreSQL and transaction-pooled PgBouncer
        run: |
          for role in web mfa queue session; do
            case "$role" in
              web) password='ci-only-web' ;;
              mfa) password='ci-only-mfa' ;;
              queue) password='ci-only-queue' ;;
              session) password='ci-only-session' ;;
            esac
            for port in 5432 16432; do
              PGPASSWORD="$password" psql -v ON_ERROR_STOP=1 \
                -v expected_role="p003e_$role" \
                -h 127.0.0.1 -p "$port" -U "p003e_$role" -d "$DB_DATABASE" \
                -f database/security/p003e_role_partition_checks.sql
            done
          done
      - name: Seed disposable P0-03F first-time enrollment grant
        run: php tests/integration/p003f_seed.php
      - name: Run real P0-03F split-principal Auth/MFA/Session HTTP through PgBouncer
        env:
          DB_USERNAME: p003e_web
          DB_PASSWORD: ci-only-web
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          SESSION_DRIVER: database
          SESSION_CONNECTION: pgsql_session
          DB_SESSION_USERNAME: p003e_session
          DB_SESSION_PASSWORD: ci-only-session
          DB_SESSION_PORT: '16432'
          DB_SESSION_PGBOUNCER_TRANSACTION: 'true'
          ERP_ROLE_PARTITION_REQUIRED: 'true'
          ERP_MFA_DB_CONNECTION: pgsql_mfa
          DB_MFA_USERNAME: p003e_mfa
          DB_MFA_PASSWORD: ci-only-mfa
          DB_MFA_PORT: '16432'
          DB_MFA_PGBOUNCER_TRANSACTION: 'true'
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          php -S 127.0.0.1:18032 -t public public/index.php > /tmp/p003f-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; tail -n 100 /tmp/p003f-http.log' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18032/api/v1/health | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          python3 tests/integration/p003f_http.py
      - name: Run five reused Laravel worker jobs with dedicated Queue SQL role through PgBouncer
        env:
          DB_USERNAME: p003e_web
          DB_PASSWORD: ci-only-web
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          ERP_ROLE_PARTITION_REQUIRED: 'true'
          ERP_MFA_DB_CONNECTION: pgsql_mfa
          DB_MFA_USERNAME: p003e_mfa
          DB_MFA_PASSWORD: ci-only-mfa
          DB_MFA_PORT: '16432'
          DB_MFA_PGBOUNCER_TRANSACTION: 'true'
          DB_QUEUE_CONNECTION: pgsql_queue
          DB_QUEUE_USERNAME: p003e_queue
          DB_QUEUE_PASSWORD: ci-only-queue
          DB_QUEUE_PORT: '16432'
          DB_QUEUE_PGBOUNCER_TRANSACTION: 'true'
          DB_FAILED_CONNECTION: pgsql_queue
          QUEUE_CONNECTION: database
          P003_EVIDENCE_FILE: /tmp/p003f-queue-evidence.jsonl
        run: |
          rm -f /tmp/p003f-queue-evidence.jsonl
          php tests/integration/p003f_queue_seed.php
          php artisan queue:work database --queue=p003f --stop-when-empty --tries=1 --sleep=1 --timeout=30 --max-time=120
          php tests/integration/p003f_queue_assert.php
      - name: Prove P0-03F split Web role concurrent revocation using limited row-lock helper
        env:
          DB_USERNAME: p003e_web
          DB_PASSWORD: ci-only-web
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          ERP_ROLE_PARTITION_REQUIRED: 'true'
          ERP_MFA_DB_CONNECTION: pgsql_mfa
          DB_MFA_USERNAME: p003e_mfa
          DB_MFA_PASSWORD: ci-only-mfa
          DB_MFA_PORT: '16432'
          DB_MFA_PGBOUNCER_TRANSACTION: 'true'
          P003C_OWNER_PASSWORD: test-only
        run: php tests/integration/p003f_runtime_race.php
      - name: Install disposable fault injection for P0-03F split-MFA rollback
        run: php tests/integration/p003f_rollback_prepare.php
      - name: Prove atomic MFA grant factor and recovery rollback with restricted MFA SQL role
        env:
          DB_USERNAME: p003e_web
          DB_PASSWORD: ci-only-web
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          ERP_ROLE_PARTITION_REQUIRED: 'true'
          ERP_MFA_DB_CONNECTION: pgsql_mfa
          DB_MFA_USERNAME: p003e_mfa
          DB_MFA_PASSWORD: ci-only-mfa
          DB_MFA_PORT: '16432'
          DB_MFA_PGBOUNCER_TRANSACTION: 'true'
        run: php tests/integration/p003f_rollback_probe.php
      - name: Build backend Docker image
        run: docker build --tag elmo-erp-backend:p0-01 .
      - name: Smoke-test container API health
        shell: bash
        run: |
          set -euo pipefail
          key="$(php artisan key:generate --show)"
          docker run --detach --rm --name erp-v2-backend-ci --publish 18000:8000 \
            --env APP_ENV=testing --env "APP_KEY=$key" elmo-erp-backend:p0-01
          trap 'docker rm --force erp-v2-backend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs erp-v2-backend-ci
          exit 1
