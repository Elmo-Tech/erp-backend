name: Backend CI
on:
  push:
    branches: [rebuild/erp-v2]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elmo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: elmo_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elmo" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, redis, pcntl, bcmath, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: elmo_erp_test
          DB_USERNAME: elmo
          DB_PASSWORD: test-only

