name: Backend CI
on:
  push:
    branches: [rebuild/erp-v2]
  pull_request:
    branches: [rebuild/erp-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: elmo_erp_test
      DB_USERNAME: elmo
      DB_PASSWORD: test-only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elmo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: elmo_erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elmo -d elmo_erp_test" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Require an authentic Composer lockfile
        run: |
          test -s composer.lock || { echo '::error::composer.lock missing; generate using Composer 2 with registry access and commit it'; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, redis, pcntl, bcmath, intl
          coverage: none
      - name: Validate and install locked PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated test application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify PostgreSQL 18 migrations
        run: php artisan migrate:fresh --force --no-interaction
      - name: Run PHPUnit against disposable PostgreSQL 18
        run: php artisan test --no-ansi
      - name: Verify P0-03 migration rollback and re-apply on disposable PostgreSQL
        run: |
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction
      - name: Verify disposable PostgreSQL RLS role and transaction-local context
        run: PGPASSWORD="$DB_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -f database/security/p003_rls_pilot.sql
      - name: Verify two PostgreSQL sessions, company context and exclusion races
        run: php tests/integration/p003_concurrency.php
      - name: Start real PgBouncer in transaction pooling mode (disposable only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pgbouncer
          sudo systemctl stop pgbouncer || true
          cat > /tmp/p003b-pgbouncer.ini <<'EOF'
          [databases]
          elmo_erp_test = host=127.0.0.1 port=5432 dbname=elmo_erp_test user=elmo password=test-only
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 16432
          auth_type = trust
          auth_file = /tmp/p003b-auth.txt
          admin_users = elmo
          pool_mode = transaction
          default_pool_size = 2
          max_client_conn = 100
          server_reset_query = DISCARD ALL
          max_prepared_statements = 100
          EOF
          echo '"elmo" "test-only"' > /tmp/p003b-auth.txt
          pgbouncer /tmp/p003b-pgbouncer.ini > /tmp/p003b-pgbouncer.log 2>&1 &
          sleep 2
          cat /tmp/p003b-pgbouncer.log
          PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p 16432 -U elmo pgbouncer -Atc 'SHOW CONFIG' | grep -E '^pool_mode[|]transaction[|]'
      - name: Run authenticated-context tests through actual PgBouncer
        env:
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
        run: php artisan test --no-ansi tests/P003B/P003AuthenticatedContextTest.php
      - name: Verify two parallel clients through real transaction pool
        env:
          DB_PORT: '16432'
        run: php tests/integration/p003_pool_clients.php
      - name: Run five jobs inside one reused Laravel queue worker through PgBouncer
        env:
          DB_PORT: '16432'
          DB_PGBOUNCER_TRANSACTION: 'true'
          QUEUE_CONNECTION: database
          P003_EVIDENCE_FILE: /tmp/p003b-queue-evidence.jsonl
        run: |
          rm -f /tmp/p003b-queue-evidence.jsonl
          php tests/integration/p003_queue_seed.php
          php artisan queue:work database --queue=p003b --stop-when-empty --tries=1 --sleep=1 --timeout=30 --max-time=120
          php tests/integration/p003_queue_assert.php
      - name: Build backend Docker image
        run: docker build --tag elmo-erp-backend:p0-01 .
      - name: Smoke-test container API health
        shell: bash
        run: |
          set -euo pipefail
          key="$(php artisan key:generate --show)"
          docker run --detach --rm --name erp-v2-backend-ci --publish 18000:8000 \
            --env APP_ENV=testing --env "APP_KEY=$key" elmo-erp-backend:p0-01
          trap 'docker rm --force erp-v2-backend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs erp-v2-backend-ci
          exit 1
